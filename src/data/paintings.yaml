# Paintings: one entry per original.
# PLACEHOLDER entries below: replace with her real work, then delete these.
#
# id:          URL slug (lowercase, hyphens). Put images in src/assets/paintings/<id>/
# title, year, medium
# dimensions:  width / height (/ depth) in inches
# series:      id from series.yaml
# framed:      true or false; optional `frame` describes it
# note:        short note on the piece, in her voice
# alt:         describe the painting for screen readers and search
# price:       whole US dollars, always shown
# status:      available | sold | reserved
# featured:    true to include in the home page hero rotation
# images:      main (required), closeups (up to 2)
# rooms:       optional. Up to 2 room ids from rooms.yaml for the true-scale mockup,
#              e.g. [living-room] or [living-room, bedroom]. Leave out to use the default room.
#              The painting is placed on the wall automatically from its dimensions.
# checkout:    Stripe Payment Link for the original (add once Stripe is set up)
# prints:      optional. edition: open | limited (limited needs editionSize)
#              options: list of { size, paper, price, checkout }

